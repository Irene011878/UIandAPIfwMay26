name: Automated Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        run: mvn test "-DsuiteXmlFile=src/test/resources/runners/testng-api.xml"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload API Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: target/site/allure-maven-plugin


  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run UI tests
        run: mvn test "-Dheadless=true" "-DsuiteXmlFile=src/test/resources/runners/testng-ui.xml"

      - name: Generate UI Allure report
        if: always()
        run: mvn allure:report

      - name: Upload UI Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

  publish-allure:
        name: Publish Allure Reports
        if: always()
        needs:
          - api-tests
          - ui-tests

        runs-on: ubuntu-latest

        permissions:
          contents: read
          pages: write
          id-token: write

        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}

        steps:
          - name: Configure GitHub Pages
            uses: actions/configure-pages@v5

          - name: Download API Allure report
            uses: actions/download-artifact@v4
            with:
              name: allure-report-api
              path: site/api

          - name: Download UI Allure report
            uses: actions/download-artifact@v4
            with:
              name: allure-report-ui
              path: site/ui

          - name: Verify downloaded reports
            run: |
              echo "=== API REPORT ==="
              find site/api -maxdepth 2 -type f | head -30
              echo "=== UI REPORT ==="
              find site/ui -maxdepth 2 -type f | head -30

          - name: Upload combined Allure reports
            uses: actions/upload-pages-artifact@v4
            with:
              path: site

          - name: Deploy Allure reports
            id: deployment
            uses: actions/deploy-pages@v4