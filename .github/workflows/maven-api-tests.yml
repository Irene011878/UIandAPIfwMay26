name: Automated Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        run: mvn test "-DsuiteXmlFile=src/test/resources/runners/testng-api.xml"


  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run UI tests
        run: mvn test "-Dheadless=true" "-DsuiteXmlFile=src/test/resources/runners/testng-ui.xml"